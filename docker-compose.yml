version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dataflow_postgres
    environment:
      POSTGRES_USER: dataflow
      POSTGRES_PASSWORD: dataflow_secret
      POSTGRES_DB: dataflow_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dataflow']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dataflow_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dataflow_backend
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://dataflow:dataflow_secret@postgres:5432/dataflow_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_this_secret_in_production
      PORT: 3001
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dataflow_frontend
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
